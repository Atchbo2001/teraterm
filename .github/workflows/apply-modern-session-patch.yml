name: Apply modern session bootstrap

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.repository == 'Atchbo2001/teraterm'
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/modern-session-ui
          fetch-depth: 0

      - name: Apply reviewed source patch
        shell: pwsh
        run: python tools/fork/apply_modern_session_patch.py

      - name: Validate and commit source changes when needed
        shell: bash
        run: |
          git -c core.whitespace=cr-at-eol diff --check
          if git diff --quiet -- teraterm/teraterm/vtwin.cpp teraterm/ttpset/ttset.c; then
            echo 'Modern session source patch is already applied.'
            exit 0
          fi
          git diff -- teraterm/teraterm/vtwin.cpp teraterm/ttpset/ttset.c
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- teraterm/teraterm/vtwin.cpp teraterm/ttpset/ttset.c
          git commit -m 'feat: keep terminal alive after connection loss'
          git push origin HEAD:feature/modern-session-ui
