name: Apply modern session bootstrap

on:
  workflow_dispatch:
  push:
    branches:
      - feature/modern-session-ui
    paths:
      - .github/workflows/apply-modern-session-patch.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.repository == 'Atchbo2001/teraterm'
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/modern-session-ui
          fetch-depth: 0

      - name: Apply reviewed source patch
        shell: pwsh
        run: python tools/fork/apply_modern_session_patch.py

      - name: Validate and commit source changes when needed
        shell: bash
        run: |
          git -c core.whitespace=cr-at-eol diff --check
          if git diff --quiet -- teraterm/teraterm/vtwin.cpp teraterm/teraterm/vtwin.h teraterm/ttpset/ttset.c; then
            echo 'Boooyah session lifecycle source patch is already applied.'
            exit 0
          fi
          git diff -- teraterm/teraterm/vtwin.cpp teraterm/teraterm/vtwin.h teraterm/ttpset/ttset.c
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- teraterm/teraterm/vtwin.cpp teraterm/teraterm/vtwin.h teraterm/ttpset/ttset.c
          git commit -m 'feat: track Boooyah session lifecycle'
          git push origin HEAD:feature/modern-session-ui
