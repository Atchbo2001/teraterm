name: Fork session policy test

on:
  push:
    branches:
      - 'feature/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  session_policy_test:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Verify VT C/C++ boundary
        run: python tools/fork/test_vtwin_cpp_boundary.py
      - name: Build session policy test
        shell: cmd
        run: |
          cl /nologo /std:c++17 /EHsc /W4 /WX ^
            teraterm\teraterm\session_state_test.cpp ^
            teraterm\teraterm\session_state.cpp ^
            /Fe:session_state_test.exe
      - name: Run session policy test
        shell: cmd
        run: session_state_test.exe
      - name: Build session bar policy test
        shell: cmd
        run: |
          cl /nologo /std:c++17 /EHsc /W4 /WX ^
            teraterm\teraterm\session_bar_model_test.cpp ^
            /Fe:session_bar_model_test.exe
      - name: Run session bar policy test
        shell: cmd
        run: session_bar_model_test.exe
      - name: Build Quick Connect policy test
        shell: cmd
        run: |
          cl /nologo /std:c++17 /EHsc /W4 /WX ^
            teraterm\teraterm\boooyah_home_model_test.cpp ^
            /Fe:boooyah_home_model_test.exe
      - name: Run Quick Connect policy test
        shell: cmd
        run: boooyah_home_model_test.exe
